<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DLICOM: BOMBER ADVENTURE</title>
<style>
  :root { --navy:#07152f; --panel:#10264a; --cyan:#22d3ee; --pink:#f43f72; }
  * { box-sizing:border-box; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  body { margin:0; min-height:100vh; background:radial-gradient(ellipse at top,#12305b,#061126 70%); color:#fff; font-family:system-ui,-apple-system,Segoe UI,sans-serif; display:flex; flex-direction:column; align-items:center; padding:12px; }
  .hud { width:min(100%,900px); display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; background:#102344eF; border:1px solid #1e4779; border-radius:14px; padding:10px 14px; margin-bottom:10px; box-shadow:0 8px 24px #0005; }
  .brand { color:var(--cyan); font-weight:1000; letter-spacing:2px; font-size:clamp(15px,3vw,24px); text-align:center; }
  .stat { font-weight:900; color:#facc15; white-space:nowrap; font-size:14px; }
  .stat b { color:white; font-size:18px; margin-left:4px; }
  .hud button { border:0; border-radius:9px; padding:9px 13px; color:white; background:#e11d48; font-weight:900; cursor:pointer; }
  .level { background:#4f46e5; border-radius:9px; padding:8px 12px; font-weight:900; font-size:13px; white-space:nowrap; }
  .game-wrap { width:min(100%,900px); position:relative; }
  canvas { display:block; width:100%; height:auto; background:#d1fae5; border-radius:12px; border:3px solid #164477; box-shadow:0 12px 30px #0007; }
  .overlay { position:absolute; inset:0; border-radius:10px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:20px; background:#061329eF; z-index:2; }
  .overlay.hidden { display:none; }
  .overlay h1 { color:var(--cyan); font-size:clamp(24px,5vw,42px); margin:0 0 8px; font-weight:1000; }
  .overlay p { color:#cbd5e1; margin:0 0 20px; max-width:460px; }
  .overlay button { border:0; border-radius:12px; padding:13px 28px; background:var(--cyan); color:#052033; font-size:17px; font-weight:1000; cursor:pointer; }
  .controls { width:min(100%,900px); display:flex; justify-content:space-between; align-items:center; padding:14px 10px 0; }
  .dpad { display:grid; grid-template-columns:repeat(3,48px); grid-template-rows:repeat(3,44px); gap:4px; }
  .dpad button,.bomb-btn { border:1px solid #2563a5; background:#15335c; color:#dffaff; font-size:23px; font-weight:900; border-radius:10px; box-shadow:0 4px 0 #07172f; }
  .dpad button:active,.bomb-btn:active { transform:scale(.96); background:#087ca6; }
  .dpad .up {grid-column:2;grid-row:1}.dpad .left {grid-column:1;grid-row:2}.dpad .right {grid-column:3;grid-row:2}.dpad .down {grid-column:2;grid-row:3}
  .bomb-btn { width:92px;height:92px;border-radius:50%;background:#e11d48;border:4px solid #fb7185;font-size:28px;display:flex;flex-direction:column;align-items:center;justify-content:center; }
  .bomb-btn span {font-size:11px;letter-spacing:1px}
  .help { color:#9db5d3; font-size:12px; text-align:center; margin:12px 0 4px; }
  @media (min-width:700px) { .controls { padding-left:28px;padding-right:28px } }
  @media (max-width:420px) { body{padding:7px}.hud{padding:8px}.dpad{grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,39px)}.bomb-btn{width:78px;height:78px} }
</style>
</head>
<body>
  <header class="hud">
    <div class="stat">DILI LIVES: <b id="lives">3</b></div>
    <div class="stat">SCORE: <b id="score">00000</b></div>
    <div class="stat">BOMBS: <b id="bombCount">1</b></div>
    <div class="stat">RANGE: <b id="bombRange">2</b></div>
    <div class="brand"><img id="headerLogo" alt="" style="width:25px;height:25px;object-fit:contain;vertical-align:middle;margin-right:6px">DLICOM: BOMBER</div>
    <div class="level" id="level">LEVEL 1</div>
    <button id="restart">RESTART</button>
  </header>

  <main class="game-wrap">
    <canvas id="game" aria-label="DLICOM Bomber game"></canvas>
    <div class="overlay" id="overlay">
      <h1 id="overlayTitle">DLICOM BOMBER</h1>
      <p id="overlayText">Help Dili defeat the blue monsters across 5 levels!</p>
      <button id="action">START GAME</button>
    </div>
  </main>

  <section class="controls">
    <div class="dpad" aria-label="Movement controls">
      <button class="up" data-dir="up">▲</button>
      <button class="left" data-dir="left">◀</button>
      <button class="right" data-dir="right">▶</button>
      <button class="down" data-dir="down">▼</button>
    </div>
    <button class="bomb-btn" id="bombButton">💣<span>BOMB</span></button>
  </section>
  <div class="help">Move: WASD / Arrow Keys · Bomb: Space · Mobile: use controls · 5 levels</div>

  const dirs = [{x:0,y:-1,n:'up'},{x:0,y:1,n:'down'},{x:-1,y:0,n:'left'},{x:1,y:0,n:'right'}];

  function randInt(n){ return Math.floor(Math.random()*n); }
  function inside(c,r){ return c>=0 && r>=0 && c<COLS && r<ROWS; }
  function tileAt(px,py){ return {c:Math.floor((px+TILE/2)/TILE),r:Math.floor((py+TILE/2)/TILE)}; }

  function initMap(){
    map = Array.from({length:ROWS},(_,r)=>Array.from({length:COLS},(_,c)=>{
      if(r===0||c===0||r===ROWS-1||c===COLS-1||(r%2===0&&c%2===0)) return 1;
      return 0;
    }));
    // Keep the starting pocket clear.
    [[1,1],[1,2],[2,1],[1,3],[3,1]].forEach(([r,c])=>{if(inside(c,r))map[r][c]=0;});
    for(let r=1;r<ROWS-1;r++) for(let c=1;c<COLS-1;c++){
      if(map[r][c]===0 && !(r<=2&&c<=2) && Math.random()<0.34) map[r][c]=2;
    }
  }
  function spawnMonsters(){
    monsters=[];
    const wanted=4+level*2;
    const free=[];
    for(let r=1;r<ROWS-1;r++) for(let c=1;c<COLS-1;c++){
      if(map[r][c]===0 && (Math.abs(c-1)+Math.abs(r-1)>5)) free.push({c,r});
    }
    // Shuffle candidates; never wait forever if map has limited open tiles.
    for(let i=free.length-1;i>0;i--){const j=randInt(i+1);[free[i],free[j]]=[free[j],free[i]];}
    for(const spot of free.slice(0,Math.min(wanted,free.length))){
      const red=Math.random()<Math.min(.15+level*.07,.5);
      monsters.push({x:spot.c*TILE,y:spot.r*TILE,type:red?'red':(Math.random()<.5?'blue':'orange'),speed:red?66:48,dir:dirs[randInt(4)].n,turn:0});
    }
  }
  function resetLevel(){ bombs=[]; explosions=[]; items=[]; player.x=TILE;player.y=TILE;invulnerable=1000;initMap();spawnMonsters(); }
  function resetGame(){level=1;score=0;lives=3;syncHud();resetLevel();state='PLAYING';hideOverlay();}

  function syncHud(){ $('lives').textContent=lives; $('score').textContent=String(score).padStart(5,'0'); $('level').textContent=`LEVEL ${level}`; $('bombCount').textContent=player.maxBombs; $('bombRange').textContent=player.range; }
  function showOverlay(title,text,button='PLAY AGAIN'){ $('overlayTitle').textContent=title;$('overlayText').textContent=text;$('action').textContent=button;$('overlay').classList.remove('hidden'); }
  function hideOverlay(){ $('overlay').classList.add('hidden'); }

  function solid(c,r){
    if(!inside(c,r)||map[r][c]!==0) return true;
    return bombs.some(b=>b.c===c&&b.r===r&&!b.passable);
  }
  function canMove(x,y){
    const pad=9;
    const pts=[[x+pad,y+pad],[x+TILE-pad,y+pad],[x+pad,y+TILE-pad],[x+TILE-pad,y+TILE-pad]];
    // A bomb blocks movement, except while Dili is still overlapping the bomb
    // he just placed. This lets the player escape without being trapped by its hitbox.
    for(const [px,py] of pts){
      const c=Math.floor(px/TILE),r=Math.floor(py/TILE);
      if(!inside(c,r)||map[r][c]!==0)return false;
    }
    for(const b of bombs){
      const bx=b.c*TILE,by=b.r*TILE;
      const overlaps=(px,py)=>px+TILE-pad>bx && px+pad<bx+TILE && py+TILE-pad>by && py+pad<by+TILE;
      const candidateOverlaps=overlaps(x,y);
      const currentOverlaps=overlaps(player.x,player.y);
      if(candidateOverlaps&&!currentOverlaps)return false;
    }
    return true;
  }
  function movePlayer(dx,dy,dt){
    const step=player.speed*dt;
    const nx=player.x+dx*step, ny=player.y+dy*step;
    if(dx){if(canMove(nx,player.y))player.x=nx;else {const aligned=Math.round(player.y/TILE)*TILE;if(Math.abs(player.y-aligned)<8)player.y=aligned;}}
    if(dy){if(canMove(player.x,ny))player.y=ny;else {const aligned=Math.round(player.x/TILE)*TILE;if(Math.abs(player.x-aligned)<8)player.x=aligned;}}
    if(dx||dy)player.facing=Math.abs(dx)>Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'up':'down');
  }
  function placeBomb(){
    if(state!=='PLAYING'||bombs.length>=player.maxBombs)return;
    const {c,r}=tileAt(player.x,player.y);
    if(bombs.some(b=>b.c===c&&b.r===r))return;
    bombs.push({c,r,timer:2100});
    // Player can leave the tile; bomb becomes solid once they step off.
  }
  function explode(b){
    const tiles=[{c:b.c,r:b.r}];
    for(const d of dirs){
      for(let i=1;i<=player.range;i++){
        const c=b.c+d.x*i,r=b.r+d.y*i;
        if(!inside(c,r)||map[r][c]===1)break;
        tiles.push({c,r});
        if(map[r][c]===2){
          map[r][c]=0; score+=50;
          // Destroyed crates can reveal upgrades: extra bomb capacity or longer blast range.
          if(Math.random()<0.38){
            items.push({c,r,type:Math.random()<0.5?'bomb':'range'});
          }
          break;
        }
      }
    }
    explosions.push({tiles,timer:520,hitPlayer:false,hitMonsters:new Set()});
  }
  function loseLife(){
    if(invulnerable>0||state!=='PLAYING')return;
    lives--;syncHud();invulnerable=1400;player.x=TILE;player.y=TILE;
    if(lives<=0){state='GAMEOVER';showOverlay('GAME OVER','Dili lost all lives. Give it another try!','TRY AGAIN');}
  }
  function update(dt){
    if(state!=='PLAYING')return;
    invulnerable=Math.max(0,invulnerable-dt*1000);
    let dx=0,dy=0;
    if(keys.has('ArrowUp')||keys.has('w')||keys.has('W')||heldTouch==='up')dy=-1;
    else if(keys.has('ArrowDown')||keys.has('s')||keys.has('S')||heldTouch==='down')dy=1;
    if(keys.has('ArrowLeft')||keys.has('a')||keys.has('A')||heldTouch==='left')dx=-1;
    else if(keys.has('ArrowRight')||keys.has('d')||keys.has('D')||heldTouch==='right')dx=1;
    if(dx&&dy){dx*=Math.SQRT1_2;dy*=Math.SQRT1_2;}
    // Let the player walk off a newly placed bomb.
    bombs.forEach(b=>{if(tileAt(player.x,player.y).c!==b.c||tileAt(player.x,player.y).r!==b.r)b.passable=false;});
    movePlayer(dx,dy,dt);

    bombs.forEach(b=>b.timer-=dt*1000);
    const expired=bombs.filter(b=>b.timer<=0);
    bombs=bombs.filter(b=>b.timer>0);
    expired.forEach(explode);

    monsters.forEach(m=>{
      m.turn-=dt;
      const dir=dirs.find(d=>d.n===m.dir)||dirs[0];
      const nx=m.x+dir.x*m.speed*dt,ny=m.y+dir.y*m.speed*dt;
      const pad=8, c=Math.floor((nx+TILE/2)/TILE),r=Math.floor((ny+TILE/2)/TILE);
      const blocked=!inside(c,r)||map[r][c]!==0||bombs.some(b=>b.c===c&&b.r===r);
      if(blocked||m.turn<=0){
        const options=dirs.filter(d=>{
          const tc=Math.floor((m.x+d.x*m.speed*dt+TILE/2)/TILE),tr=Math.floor((m.y+d.y*m.speed*dt+TILE/2)/TILE);
          return inside(tc,tr)&&map[tr][tc]===0&&!bombs.some(b=>b.c===tc&&b.r===tr);
        });
        if(options.length){const pick=options[randInt(options.length)];m.dir=pick.n;m.turn=.35+Math.random()*1.1;}
      } else {m.x=nx;m.y=ny;}
      if(Math.abs(m.x-player.x)<25&&Math.abs(m.y-player.y)<25)loseLife();
    });

    // Collect upgrade items. B = +1 simultaneous bomb, R = +1 blast range.
    const pt=tileAt(player.x,player.y);
    items=items.filter(item=>{
      if(item.c===pt.c&&item.r===pt.r){
        if(item.type==='bomb') player.maxBombs=Math.min(5,player.maxBombs+1);
        else player.range=Math.min(7,player.range+1);
        score+=100;
        return false;
      }
      return true;
    });

    explosions.forEach(ex=>{
      ex.timer-=dt*1000;
      const p=tileAt(player.x,player.y);
      if(!ex.hitPlayer&&ex.tiles.some(t=>t.c===p.c&&t.r===p.r)){ex.hitPlayer=true;loseLife();}
      monsters=monsters.filter(m=>{
        const mt=tileAt(m.x,m.y),hit=ex.tiles.some(t=>t.c===mt.c&&t.r===mt.r);
        if(hit&&!ex.hitMonsters.has(m)){ex.hitMonsters.add(m);score+=200;return false;}
        return true;
      });
    });
    explosions=explosions.filter(ex=>ex.timer>0);
    syncHud();
    if(state==='PLAYING'&&monsters.length===0){
      if(level>=5){state='WIN';showOverlay('VICTORY!','You cleared all 5 DLICOM levels!','PLAY AGAIN');}
      else {level++;syncHud();resetLevel();}
    }
  }

  function roundedRect(x,y,w,h,r,fill,stroke){
    ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();}
  }
  function drawWall(x,y){
    roundedRect(x+2,y+2,TILE-4,TILE-4,5,'#10264a','#28558a');
    if(logoSprite.complete && logoSprite.naturalWidth){
      ctx.drawImage(logoSprite,x+9,y+9,30,30);
    } else {
      ctx.fillStyle='#22d3ee';ctx.beginPath();
      ctx.moveTo(x+24,y+12);ctx.lineTo(x+35,y+23);ctx.lineTo(x+24,y+34);ctx.lineTo(x+13,y+23);ctx.closePath();ctx.fill();
    }
  }
  function drawCrate(x,y){
    roundedRect(x+3,y+3,TILE-6,TILE-6,3,'#a85413','#f59e0b');
    ctx.strokeStyle='#e9a23b';ctx.lineWidth=2;ctx.strokeRect(x+8,y+8,TILE-16,TILE-16);
    ctx.fillStyle='#fff2a8';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText('DLICOM',x+24,y+27);
  }
  function drawDili(x,y){
    // Use the uploaded Dili illustration, scaled to fit one maze tile.
    if(diliSprite.complete && diliSprite.naturalWidth){
      ctx.drawImage(diliSprite,x-10,y-13,68,70);
    } else {
      roundedRect(x+7,y+4,34,38,15,'#0284c7','#0f2748');
      ctx.fillStyle='#fff';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText('D',x+24,y+28);
    }
  }
  function drawMonster(m){
    // Recreated from the uploaded monster reference: rounded cobalt-blue blob,
    // tilted white eyes with black pupils, and a small smiling mouth.
    ctx.save();
    ctx.translate(m.x+24,m.y+24);
    const bob = Math.sin(performance.now()/180 + m.x*.01 + m.y*.01) * 1.2;
    ctx.translate(0,bob);
    ctx.rotate(Math.sin(performance.now()/900 + m.x*.02)*0.025);

    // soft shadow
    ctx.fillStyle='#0002';
    ctx.beginPath(); ctx.ellipse(0,17,18,4,0,0,Math.PI*2); ctx.fill();

    // body
    ctx.beginPath();
    ctx.moveTo(-21,4);
    ctx.bezierCurveTo(-25,-9,-14,-17,0,-18);
    ctx.bezierCurveTo(15,-19,25,-11,22,1);
    ctx.bezierCurveTo(20,12,8,16,-4,16);
    ctx.bezierCurveTo(-15,16,-21,12,-21,4);
    ctx.closePath();
    const grad=ctx.createLinearGradient(0,-18,0,18);
    grad.addColorStop(0,'#4b5bff'); grad.addColorStop(1,'#263bd8');
    ctx.fillStyle=grad; ctx.fill();
    ctx.strokeStyle='#1f2da8'; ctx.lineWidth=1.5; ctx.stroke();

    // eyes
    const eye=(x,y,ang)=>{
      ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.roundRect(-8,-6,15,12,2); ctx.fill();
      ctx.fillStyle='#05070d'; ctx.fillRect(-1,-4,7,8);
      ctx.restore();
    };
    eye(-8,-3,-0.58); eye(8,-3,0.58);

    // smile
    ctx.strokeStyle='#05070d'; ctx.lineWidth=2.7; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(0,1,6,0.2,Math.PI-0.2); ctx.stroke();
    ctx.restore();
  }
  function render(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      const x=c*TILE,y=r*TILE;
      ctx.fillStyle='#d1fae5';ctx.fillRect(x,y,TILE,TILE);
      ctx.strokeStyle='#b4e9d5';ctx.lineWidth=1;ctx.strokeRect(x+.5,y+.5,TILE-1,TILE-1);
      if(map[r][c]===1)drawWall(x,y);else if(map[r][c]===2)drawCrate(x,y);
    }
    // Power-ups on the floor. They appear after some crates are destroyed.
    items.forEach(item=>{
      const x=item.c*TILE+24,y=item.r*TILE+24;
      ctx.fillStyle='#0002';ctx.beginPath();ctx.ellipse(x,y+14,13,4,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle=item.type==='bomb'?'#facc15':'#22d3ee';
      ctx.beginPath();ctx.arc(x,y,14,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle='#06213d';ctx.font='900 18px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(item.type==='bomb'?'B':'R',x,y+1);
      ctx.textBaseline='alphabetic';
    });
    bombs.forEach(b=>{
      const x=b.c*TILE+24,y=b.r*TILE+24;
      ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(x,y+15,15,5,0,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#075985';ctx.beginPath();ctx.arc(x,y,16,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#38bdf8';ctx.lineWidth=3;ctx.stroke();
      ctx.fillStyle='#fff';ctx.font='bold 8px system-ui';ctx.textAlign='center';ctx.fillText('DILI',x,y+3);
      ctx.strokeStyle='#facc15';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x+4,y-14);ctx.lineTo(x+10,y-22);ctx.stroke();
    });
    explosions.forEach(ex=>ex.tiles.forEach(t=>{
      ctx.fillStyle='#fb923c';ctx.fillRect(t.c*TILE+3,t.r*TILE+3,TILE-6,TILE-6);
      ctx.fillStyle='#fde047';ctx.fillRect(t.c*TILE+11,t.r*TILE+11,TILE-22,TILE-22);
    }));
    monsters.forEach(drawMonster);
    if(invulnerable<=0||Math.floor(invulnerable/100)%2===0)drawDili(player.x,player.y);
  }
  function frame(now){
    const dt=Math.min((now-lastTime)/1000||0,0.05);lastTime=now;
    update(dt);render();requestAnimationFrame(frame);
  }

  window.addEventListener('keydown',e=>{
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();
    keys.add(e.key);
    if(e.key===' '&&!e.repeat)placeBomb();
  });
  window.addEventListener('keyup',e=>keys.delete(e.key));
  window.addEventListener('blur',()=>{keys.clear();heldTouch=null;});
  document.querySelectorAll('[data-dir]').forEach(btn=>{
    const start=e=>{e.preventDefault();heldTouch=btn.dataset.dir;};
    const stop=e=>{e.preventDefault();if(heldTouch===btn.dataset.dir)heldTouch=null;};
    btn.addEventListener('pointerdown',start);btn.addEventListener('pointerup',stop);
    btn.addEventListener('pointercancel',stop);btn.addEventListener('pointerleave',stop);
  });
  $('bombButton').addEventListener('pointerdown',e=>{e.preventDefault();placeBomb();});
  $('action').onclick=()=>{if(state==='START'||state==='GAMEOVER'||state==='WIN')resetGame();else{state='PLAYING';hideOverlay();}};
  $('restart').onclick=()=>{resetGame();};
  initMap();spawnMonsters();syncHud();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
